name: Build for Windows ARM64

on:
  push:

jobs:
  build-windows-arm64:
    name: Build
    runs-on: ubuntu-latest
    env:
      llvm_path: "${{ github.workspace }}/llvm-mingw"
      privoxy_version: "4.1.0"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install \
            build-essential cmake ninja-build pkg-config p7zip curl
          wget https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-*.tar.xz
          mv llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64 llvm-mingw
  
      - name: Setup a new (or from cache) vcpkg (and does not build any package)
        uses: lukka/run-vcpkg@v11 # Always specify the specific _version_ of the
                                  # action you need, `v11` in this case to stay up
                                 # to date with fixes on the v11 branch
        with:
          vcpkgGitCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'

      - name: Install dependencies from vcpkg
        run: |
          PATH=$PATH:${{ env.llvm_path }}/bin
          # tell vcpkg to only build Release variants of the dependencies
          cd ${{ env.RUNVCPKG_VCPKG_ROOT }}
          mkdir triplets_overlay
          cp triplets/community/arm64-mingw-static.cmake triplets_overlay/arm64-mingw-static-release.cmake
          echo "set(VCPKG_BUILD_TYPE release)" >> triplets_overlay/arm64-mingw-static-release.cmake
          packages="pcre2 brotli zlib mbedtls"
          ./vcpkg upgrade 
          ./vcpkg install $packages --overlay-triplets=triplets_overlay --triplet arm64-mingw-static-release --clean-after-build 
          cd installed/arm64-mingw-static-release/lib
          ln libzs.a libz.a
          
      - name: Build privoxy
        run: | 
          PATH=$PATH:${{ env.llvm_path }}/bin 
          wget "https://www.silvester.org.uk/privoxy/Sources/${{ env.privoxy_version }}%20%28stable%29/privoxy-${{ env.privoxy_version }}-stable-src.tar.gz"
          tar -xf privoxy-${{ env.privoxy_version }}-stable-src.tar.gz
          cd privoxy-${{ env.privoxy_version }}-stable
          autoheader
          autoconf
          export CPPFLAGS="-I${{ env.RUNVCPKG_VCPKG_ROOT }}/installed/arm64-mingw-static-release/include"
          export CFLAGS="-Wno-error=incompatible-pointer-types"
          export LDFLAGS="-L${{ env.RUNVCPKG_VCPKG_ROOT }}/installed/arm64-mingw-static-release/lib -lbcrypt -lcrypt32"
          ./configure --host=aarch64-w64-mingw32 --enable-mingw32 \
              --enable-zlib -with-brotli --with-mbedtls \
              --enable-static-linking \
              --disable-pthread \
              --enable-compression \
              --enable-large-file-support \
              --prefix=${{ github.workspace }}/upload
          sed -i 's/-F pe-i386/ /g' GNUmakefile
          sed -i 's/windres/aarch64-w64-mingw32-windres/g' GNUmakefile
          sed -i 's/DWINVER=0x501/DWINVER=0x0A00/g' GNUmakefile
          make

      - name: Prepare build artifacts
        run: |
          PATH=$PATH:${{ env.llvm_path }}/bin 
          aarch64-w64-mingw32-strip privoxy-${{ env.privoxy_version }}-stable/privoxy.exe
          curl -L "https://www.silvester.org.uk/privoxy/Windows/${{ env.privoxy_version }}%20(stable)/privoxy_${{ env.privoxy_version }}.zip" -o privoxy.zip
          7z x privoxy.zip
          cp privoxy-${{ env.privoxy_version }}-stable/privoxy.exe privoxy_${{ env.privoxy_version }}
          7z a privoxy_${{ env.privoxy_version }}_arm64.zip privoxy_${{ env.privoxy_version }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: privoxy_${{ env.privoxy_version }}_arm64
          path: privoxy_${{ env.privoxy_version }}_arm64.zip

      - name: Batch release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: privoxy_${{ env.privoxy_version }}_arm64.zip
